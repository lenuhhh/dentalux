<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Фон -->
  <rect width="100" height="100" rx="20" fill="#1C3D2E"/>
  
  <!-- Внешний круг зуба -->
  <circle cx="50" cy="45" r="28" fill="#B89A5A" opacity="0.9"/>
  
  <!-- Центральная часть зуба -->
  <ellipse cx="50" cy="50" rx="18" ry="22" fill="#F5F0E8"/>
  
  <!-- Бликовая ривала (лоск) -->
  <ellipse cx="45" cy="40" rx="8" ry="10" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Корень зуба -->
  <path d="M 40 72 Q 50 82 60 72 Q 55 75 50 75 Q 45 75 40 72" fill="#B89A5A" opacity="0.7"/>
  
  <!-- Улучшеная линия на зубе (фиссура) -->
  <line x1="50" y1="30" x2="50" y2="70" stroke="#1C3D2E" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Декоративные элементы по краям -->
  <circle cx="20" cy="20" r="3" fill="#D4B97A" opacity="0.7"/>
  <circle cx="80" cy="80" r="3" fill="#D4B97A" opacity="0.7"/>
  <circle cx="80" cy="20" r="2" fill="#D4B97A" opacity="0.5"/>
  <circle cx="20" cy="80" r="2" fill="#D4B97A" opacity="0.5"/>
</svg>
